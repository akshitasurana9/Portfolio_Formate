<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .con{
            height: 500px;
            width: 80%;
            /* border: 1px solid black; */
            margin: 50px 50px 50px 150px;
            display: flex;
        }
        .box1{
            height: 100%;
            width: 2%;
            /* border: 1px solid black; */
            border-radius: 10px;
            background-color: navy;
        }
        
        .box2{
            background-color: whitesmoke;
            height: 100%;
            width: 60%;
            /* border: 1px solid black; */
            font-size: 62px;
            color: navy;
            /* letter-spacing: 1px; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-left: 20px;
            
        }
        .box3{
            height: 100%;
            width: 38%;
            /* border: 1px solid black; */
            box-shadow: 3px 3px 3px;
            border-radius: 30px;
        }
        .top{
            height: 30%;
            width: 100%;
            /* border: 1px solid black; */
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }
        .bottom{
        }
        .top-in{
            height: 90%;
            width: 100%;
            border: 1px solid black;
            background-color: navy;
            display: flex;
            justify-content: center;
            align-items: end;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }
        .circule{
            position:absolute;
            height: 120px;
            width: 120px;
            background-color: #010885f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgb(0, 6, 114);
        }
        img{
            width: 90%;
            height: 90%;
            border-radius: 50%;
        }
        .icon{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 50%;
        }
        .a{
            padding-top:20px ;
        }
        .Botton{
            height: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            gap: 30px;
        }
        .b1{
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 40%;
            background-color: navy;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            color: red;
        }
        .fa-github{
            color:black;
        }
        .fa-whatsapp{
            color: green;
        }
        .fa-linkedin{
            color: blue;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box1"></div>
        <div class="box2">
            <b><h1>Profile Card UI UX Design</h1></b>
        </div>
        <div class="box3">
            <div class="top">
                <div class="top-in">
                    <div class="circule">
                            <img src="Forest.jpg" alt="">
                    </div>
                </div>
            </div>
            <div class="bottom">
                <h2 align="center" class="a">Website Developer</h2>
                <h3 align="center" class="a">Dezyne École College</h3>
                <h4 align="center" class="a">BCA  2<sup>ND</sup> YEAR</h4><br>
                <div class="icon a">
                    <i class="fa fa-brands fa-2x fa-whatsapp"></i>
                    <i class="fa fa-brands fa-2x fa-instagram"></i>
                    <a href="www.github.com"><i class="fa fa-brands fa-2x fa-github"></i></a>
                    <i class="fa fa-brands fa-2x fa-linkedin"></i>
                    <i class="fa fa-brands fa-2x fa-facebook"></i>
                    <i class="fa fa-brands fa-2x fa-behance"></i>
                </div> 
                <div class="Botton a">
                    <div class="b1">Subscribe</div>
                    <div class="b1">Message</div>
                </div>
                <div class="icon a">
                    <i class="fa fa-solid fa-2x fa-heart"></i>60.4K
                    <i class="fa fa-solid fa-2x fa-comment"></i>20K
                    <i class="fa fa-solid fa-2x fa-share fa-flip-horizontal"></i>12.6K
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
